<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Dashboard</title>
    <!-- Premium, clean tech font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0B0F19; /* Deep Navy Background */
            --bg-card: #111827; /* Dark Gray Card */
            --border-card: #1F2937;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --accent-primary: #3B82F6; /* Bright Blue */
            --accent-success: #10B981; /* Emerald Green */
            --accent-hover: #2563EB;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        /* Clean, solid dashboard card */
        .dashboard-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px 0;
            font-weight: 800;
            font-size: 28px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* Solid, professional button */
        .primary-btn {
            background-color: var(--accent-primary);
            color: #ffffff;
            border: none;
            padding: 14px 40px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        .primary-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        #status-text {
            display: block;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            height: 20px;
        }

        /* Camera Feed */
        #webcam-container {
            margin-top: 24px;
            display: none;
            justify-content: center;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-card);
        }

        #webcam-container canvas {
            display: block;
            width: 100%;
            max-width: 320px;
            height: auto;
        }

        /* Clean Flat Progress Bars */
        #label-container {
            margin-top: 32px;
            display: none;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .pred-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .pred-value {
            color: var(--text-muted);
            font-weight: 800;
        }

        .track {
            width: 100%;
            height: 10px;
            background-color: #1F2937;
            border-radius: 20px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent-primary);
            border-radius: 20px;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>Vision Classifier</h1>
        <p class="subtitle">Live object detection stream</p>
        
        <button class="primary-btn" id="start-btn" onclick="init()">Start Camera</button>
        <span id="status-text"></span>
        
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <!-- AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "./"; // Your local model path

        let model, webcam, labelContainer, maxPredictions;
        const btn = document.getElementById("start-btn");
        const status = document.getElementById("status-text");

        async function init() {
            try {
                btn.style.display = "none";
                status.innerText = "Loading AI Model...";

                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                status.innerText = "Starting Camera...";

                const flip = true; 
                webcam = new tmImage.Webcam(300, 300, flip); 
                
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").style.display = "flex";
                document.getElementById("label-container").style.display = "flex";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                labelContainer = document.getElementById("label-container");
                for (let i = 0; i < maxPredictions; i++) {
                    const row = document.createElement("div");
                    row.innerHTML = `
                        <div class="pred-header">
                            <span id="name-${i}">Class</span>
                            <span class="pred-value" id="val-${i}">0%</span>
                        </div>
                        <div class="track">
                            <div class="fill" id="fill-${i}"></div>
                        </div>
                    `;
                    labelContainer.appendChild(row);
                }

                status.innerText = "Monitoring Live Feed";
                status.style.color = "var(--accent-success)";

            } catch (error) {
                status.innerText = "Error: Cannot access camera.";
                status.style.color = "#EF4444"; // Tailwind Red
                btn.style.display = "inline-block";
                btn.innerText = "Try Again";
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            for (let i = 0; i < maxPredictions; i++) {
                const percent = Math.round(prediction[i].probability * 100);
                
                document.getElementById(`name-${i}`).innerText = prediction[i].className;
                document.getElementById(`val-${i}`).innerText = percent + "%";
                document.getElementById(`fill-${i}`).style.width = percent + "%";
                
                // Solid color shifting instead of gradients
                const fillBar = document.getElementById(`fill-${i}`);
                if (percent > 85) {
                    fillBar.style.backgroundColor = "var(--accent-success)";
                } else {
                    fillBar.style.backgroundColor = "var(--accent-primary)";
                }
            }
        }
    </script>
</body>
</html>
